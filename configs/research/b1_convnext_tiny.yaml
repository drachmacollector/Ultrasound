# configs/research/b1_convnext_tiny.yaml  (R5.6, generated from configs/convnext_tiny.yaml)
#
# B1: + sector crop/mask with aspect-preserving letterbox (A1).
# Backbone hyperparameters are copied verbatim from the B0 config; only the arm keys differ.
# Seeds 11/22/33 via --seed; --out-dir runs/b1_convnext_s<seed> (scripts/research/r5_run_matrix.py).

backbone: convnext_tiny.fb_in22k_ft_in1k
num_classes: 8
pretrained: true
image_size: 224
normalize_mean:
- 0.485
- 0.456
- 0.406
normalize_std:
- 0.229
- 0.224
- 0.225
train_csv: data/splits/train.csv
val_csv: data/splits/val.csv
class_weights_json: data/processed/class_weights.json
batch_size: 64
num_workers: 4
epochs_smoke_test: 5
epochs_max: 60
early_stopping_patience: 8
optimizer: adamw
lr: 1e-4
weight_decay: 0.01
scheduler: cosine
amp: true
preprocess_mode: sector_letterbox
caliper_aug_p: 0.0
sampler: none
style_aug: false
use_class_weights: true
run_root: runs/
checkpoint_dir: runs/b1_convnext
log_dir: runs/b1_convnext/tb
seed: 11
