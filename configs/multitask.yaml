# configs/multitask.yaml
#
# Multi-task (Classification + Detection) model configuration.
# Uses ConvNeXt-Tiny backbone fine-tuned on ImageNet-22k and
# a RetinaNet detection head for real-time bounding boxes.

backbone: convnext_tiny.fb_in22k_ft_in1k
num_classes: 8
pretrained: true
image_size: 224
normalize_mean: [0.485, 0.456, 0.406]
normalize_std: [0.229, 0.224, 0.225]

train_csv: data/splits/multitask_train.csv
val_csv: data/splits/multitask_val.csv
bboxes_path: data/processed/bboxes.json
class_weights_json: data/processed/class_weights.json
num_det_classes: 3
det_loss_weight: 1.0

batch_size: 8
num_workers: 4
epochs_smoke_test: 1
epochs_max: 1
early_stopping_patience: 8

optimizer: adamw
lr: 1e-4
weight_decay: 0.01
scheduler: cosine
amp: true

log_dir: logs/multitask
checkpoint_dir: checkpoints/multitask
seed: 42
