# configs/mobilenetv3_large_100.yaml
# pretrained_cfg verified 2026-07-26: input_size=(3,224,224), mean=ImageNet, std=ImageNet, crop_pct=0.875

backbone: mobilenetv3_large_100
num_classes: 8
pretrained: true
image_size: 224
normalize_mean: [0.485, 0.456, 0.406]
normalize_std: [0.229, 0.224, 0.225]

train_csv: data/splits/train.csv
val_csv: data/splits/val.csv
class_weights_json: data/processed/class_weights.json

batch_size: 64
num_workers: 4
epochs_smoke_test: 5
epochs_max: 60
early_stopping_patience: 8

optimizer: adamw
lr: 7e-4                # placeholder — replace with lr_finder result before full run
weight_decay: 0.01
scheduler: cosine
amp: true

log_dir: logs/mobilenetv3_large_100
checkpoint_dir: checkpoints/mobilenetv3_large_100
seed: 42
